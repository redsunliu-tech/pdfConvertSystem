app:
  cookie:
    http-only: true                # JS不可访问，提升安全性
    secure: false                  # 本地开发用 false，线上 HTTPS 改为 true
    same-site: Lax                 # 防 CSRF 攻击（Strict/Lax/None）
    path: /                        # 全站有效
    access-token-max-age: 3600     # Access Token 过期时间（秒）- 1小时
    refresh-token-max-age: 604800  # Refresh Token 过期时间（秒）- 7天